# Значения для развертывания приложения на всех стендах
deployment:
  command: ["/usr/bin/java"] # Команда для старта приложения
  args: ["-jar", "app.jar"]    # Аргументы 
  replicas: "1" # Кол-во экземпляров приложения на стенде
  resources:
    requests: # Минимально запрашиваемые ресурсы
      cpu: 100m
      memory: 512Mi
    limits: # Максимально запрашиваемые ресурсы
      cpu: 500m
      memory: 1Gi
port: 8080 # Порт, который слушает приложение
